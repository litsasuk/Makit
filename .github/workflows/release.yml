name: Build Windows release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependency
        run: python -m pip install --disable-pip-version-check pyinstaller==6.21.0

      - name: Build EXE and ZIP
        shell: cmd
        env:
          MAKIT_BUILD_PYTHON: python
        run: build.cmd

      - name: Store workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Makit-windows-x64
          path: release/Makit-windows-x64.zip
          if-no-files-found: error

      - name: Attach ZIP to GitHub Release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ github.event.release.tag_name }}"
          "release/Makit-windows-x64.zip#Makit Windows x64"
          --clobber
